# Builds dist\ZHU-Setup.exe with packaging\build.ps1 (tests, frozen engine, Tauri app, NSIS installer)
# and releases it under a version that packaging\version.ps1 works out from the commits.
#
#   * Every push to main (other than documentation-only changes) becomes a release. The version
#     follows from the commit messages since the last release: a breaking change raises the main
#     version, a new feature the sub version, anything else the patch (rules: packaging\version.ps1).
#     The workflow writes that version into the app, builds, and publishes a GitHub Release with
#     the tag vX.Y.Z, the installer and its SHA-256 checksum.
#   * Pushing a tag by hand (git tag v2.0.0; git push origin v2.0.0) releases exactly that version.
#   * "Run workflow" on the Actions page builds the next version without releasing it; the
#     installer is kept with the run for 14 days.
#
# The version in the repository's files is only the starting point (the first release). The
# workflow never commits: released versions live in the tags.
#
# The runner has no NVIDIA card: the engine's smoke test then reports "CUDA available: False",
# which is expected. The CUDA runtime is still bundled, from the pip wheels.

name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A push that changes only documentation does not need a new installer.
    # (GitHub does not apply this filter to tags: a version tag always builds.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write # to create the tag and the release, and attach the installer

concurrency:
  group: installer-${{ github.ref }}
  # A newer push to a branch replaces the build of the older one (its commits are then part of
  # the newer release); the build of a tag pushed by hand always finishes.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Check out, with the history and the tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the version, and whether to build and release
        id: plan
        shell: pwsh
        run: |
          $byTag = $env:GITHUB_REF -like 'refs/tags/v*'
          if ($byTag) { ./packaging/version.ps1 -Set $env:GITHUB_REF_NAME }
          else { ./packaging/version.ps1 }
          $facts = @{}
          Get-Content $env:GITHUB_OUTPUT | ForEach-Object { $name, $value = $_ -split '=', 2; $facts[$name] = $value }
          $build = 'true'; $release = 'false'
          if ($byTag) { $release = 'true' }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            # A commit that already carries its version tag is built by that tag's own run.
            if ($facts.bump -eq 'none') { $build = 'false' } else { $release = 'true' }
          }
          "tag=v$($facts.version)", "build=$build", "release=$release" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          "### ZHU $($facts.version)`n`nbuild: $build · release: $release · decided by: $($facts.bump)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

  installer:
    name: ZHU-Setup.exe ${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      # build.ps1 limits cargo to 2 jobs for 16 GB laptops; the runner can take more.
      CARGO_BUILD_JOBS: "4"
      PYTHONUTF8: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Write the version into the app
        shell: pwsh
        run: ./packaging/version.ps1 -Set $env:VERSION

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # build.ps1 creates the virtualenv with the "py" launcher when there is none. Making it here
      # uses the Python set up above, whatever the launcher on the runner would have picked.
      - name: Create the engine's virtualenv
        shell: pwsh
        run: python -m venv engine\.venv

      - name: Build the installer
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: ZHU-Setup-${{ needs.version.outputs.version }}
          path: |
            dist/ZHU-Setup.exe
            dist/ZHU-Setup.exe.sha256
          if-no-files-found: error
          compression-level: 0 # the installer is already compressed
          retention-days: 14

      - name: Publish the release
        if: needs.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $files = @('dist/ZHU-Setup.exe', 'dist/ZHU-Setup.exe.sha256')
          $hash = (Get-Content dist/ZHU-Setup.exe.sha256 -Raw).Split(' ')[0]
          $notes = @"
          **Install:** download ``ZHU-Setup.exe`` below and run it. It needs no administrator rights.

          This build is not code-signed, so Windows SmartScreen may show "Windows protected your PC": choose **More info**, then **Run anyway**.

          SHA-256: ``$hash``
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # The release exists (the workflow was run again for the same version): replace its files.
            gh release upload $tag @files --clobber
          } else {
            # Creates the tag on this commit when it does not exist yet (a push to main).
            gh release create $tag @files --title "ZHU $tag" --notes $notes --generate-notes --target $env:GITHUB_SHA
          }
          exit $LASTEXITCODE
